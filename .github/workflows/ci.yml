name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static:
    name: static (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          # Pin shfmt. The "latest/download" URL would 404 because the asset
          # filename embeds the version (shfmt_v3.8.0_linux_amd64).
          SHFMT_VERSION=v3.8.0
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt
          shfmt --version
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck "${files[@]}"
          fi
      - name: shfmt -d
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ ${#files[@]} -gt 0 ]; then
            shfmt -i 2 -ci -sr -d "${files[@]}"
          fi

  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install bats-core
          else
            sudo apt-get update -qq
            sudo apt-get install -y bats
          fi
      - run: make unit
      - run: make contract

  integration:
    name: integration (ubuntu)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: smoke
        run: |
          chmod +x install.sh bin/oc
          bash tests/integration/smoke.sh

  windows-static:
    name: PowerShell ScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run analyzer
        shell: pwsh
        run: |
          # -Path takes a single string. Loop over files; collect errors.
          $files = git ls-files '*.ps1'
          $hasError = $false
          foreach ($f in $files) {
            $results = Invoke-ScriptAnalyzer -Path $f -ErrorAction Stop
            foreach ($r in $results) {
              Write-Host $r
              if ($r.Severity -eq 'Error') { $hasError = $true }
            }
          }
          if ($hasError) { exit 1 }
