# $schema: https://ollama-claude.dev/schema/profile-v1.json
# Security research / pentest work. Refuses to flip to cloud - code
# under review may be sensitive and must not leave the host.

name        = "security-research"
description = "Sensitive-code-on-local; oc switch cloud refused"

[install]
auto_pull         = true
forbid_cloud      = true
require_project_toml = false

[topology]
default = "same"

[claude_hooks]
install_default = true     # session-backend audit hook on by default in this profile

# Augment role defaults with code-review oriented system prompts.
# The wire-up step injects these via Claude Code's per-project config
# (opt-in; the user runs `oc wire-up --claude-settings`).
[prompts]
fast  = "You are a careful code reviewer. Flag potentially insecure patterns before answering."
tools = "When invoking tools, validate inputs as if they are attacker-controlled."
heavy = "Prefer deterministic, audit-friendly refactors. Explain risk before refactoring."
